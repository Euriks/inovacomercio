STREAMING_CHUNK:Configuring build system and packaging...

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inovacomercio-ms"
version = "1.0.0"
description = "Ecossistema ERP SaaS para Varejo de Proximidade"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
]

STREAMING_CHUNK:Configuring Ruff linter and formatter...

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["E501"]

STREAMING_CHUNK:Configuring Mypy type checker...

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

STREAMING_CHUNK:Configuring Pytest suite...

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=backend"
testpaths = [
"backend/tests",
]