version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: inovacomercio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inovacomercio
      POSTGRES_USER: inovacomercio
      POSTGRES_PASSWORD: inovacomercio123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: inovacomercio-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inovacomercio-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URI: postgresql://inovacomercio:inovacomercio123@postgres:5432/inovacomercio
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: super-secret-key
      SECRET_KEY: super-secret-key
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inovacomercio-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_API_URL: http://backend:5000/api/v1
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app

volumes:
  postgres_data:
