version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: inovacomercio
      POSTGRES_PASSWORD: inovacomercio
      POSTGRES_DB: inovacomercio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://inovacomercio:inovacomercio@postgres:5432/inovacomercio
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - INOVA_API_URL=http://backend:5000/api/v1
    depends_on:
      - backend

volumes:
  pgdata: